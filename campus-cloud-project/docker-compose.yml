services:
  #============================================#
  # Base de Datos Postgres
  #============================================#
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: CampCloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #============================================#
  # PGADMIN
  #============================================#
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: CampCloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud_net

  #============================================#
  # SQLSERVER
  #============================================#
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    container_name: CampCloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - campuscloud_net

  #============================================#
  # NEO4J
  #============================================#
  neo4j:
    image: neo4j:5-community
    container_name: CampCloud-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - campuscloud_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  #============================================#
  # MONGODB
  #============================================#
  mongodb:
    image: mongo:8.0.8-noble
    container_name: CampCloud-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campuscloud_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

 
  #============================================#
  # CASSANDRA
  #============================================#
  cassandra:
    image: cassandra:5.0.9
    container_name: CampCloud-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
    ports:
      - "127.0.0.1:${CASSANDRA_PORT}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - campuscloud_net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
#============================================#
# Volúmenes
#============================================#
volumes:
  postgres_data:
  pgadmin_data:
  sql_data:
  neo4j_data:
  mongo_data:
  cassandra_data:
#============================================#
# Redes
#============================================#
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}